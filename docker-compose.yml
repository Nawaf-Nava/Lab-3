services:
  tomcat-ghostcat-lab:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lab3-tomcat-ghostcat
    ports:
      # Bind to localhost only. Do not change to 0.0.0.0 or deploy publicly.
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8009:8009"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m

name: Validate Docker Lab

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build isolated Tomcat lab image
        run: docker build --pull -t lab3-tomcat-ghostcat:ci .
